---
  - name: Create resource group
    azure.azcollection.azure_rm_resourcegroup:
      name: "{{ azure_resource_group_name }}"
      location: "{{ azure_resource_group_location }}"
      auth_source: "credential_file"
      tags: "{{ azure_tags }}"
      state: present
    tags: always

  - name: Create virtual network
    azure_rm_virtualnetwork:
      resource_group: "{{ azure_resource_group_name }}"
      name: "{{ azure_virtual_network_name }}"
      address_prefixes: "{{ azure_virtual_network_address_prefixes }}"
    tags: always

  - name: Create subnet
    azure_rm_subnet:
      resource_group: "{{ azure_resource_group_name }}"
      name: "{{ azure_subnet_name }}"
      address_prefix: "{{ azure_subnet_address_prefix }}"
      virtual_network: "{{ azure_virtual_network_name }}"
    tags: always

  - name: Create public IP address
    azure_rm_publicipaddress:
      resource_group: "{{ azure_resource_group_name }}"
      allocation_method: Static
      name: "{{ azure_public_ip_name }}"
    register: output_ip_address
    tags: always

   # Creates an Azure network security group to allow WinRM traffic from the Ansible server to the remote host by allowing port 5985 and 5986
  - name: Create Network Security Group
    azure_rm_securitygroup:
      resource_group: "{{ azure_resource_group_name }}"
      name: "{{ azure_network_security_group_name }}"
      rules:
        - name: 'allow_powershell_remoting'
          protocol: Tcp
          destination_port_range:
            - 5986
          access: Allow
          priority: 1003
          direction: Inbound
    tags: always

  - name: Create a network interface
    azure_rm_networkinterface:
      name: "{{ azure_network_interface_name }}"
      resource_group: "{{ azure_resource_group_name }}"
      virtual_network: "{{ azure_virtual_network_name }}"
      subnet_name: "{{ azure_subnet_name }}"
      security_group: "{{ azure_network_security_group_name }}"
      ip_configurations:
        - name: default
          public_ip_address_name: "{{ azure_public_ip_name }}"
          primary: True  
    tags: always

  - name: Set the VM Image variables for Windows-10 Desktop
    set_fact:
      azure_virtual_machine_image_offer: Windows-10
      azure_virtual_machine_image_publisher: MicrosoftWindowsDesktop
      azure_virtual_machine_image_sku: WIN10-22H2-PRO
    tags:
      - win10_desktop

  - name: Set the VM Image variables for Windows-11 Desktop
    set_fact:
      azure_virtual_machine_image_offer: Windows-11
      azure_virtual_machine_image_publisher: MicrosoftWindowsDesktop
      azure_virtual_machine_image_sku: WIN11-23H2-PRO
    tags:
      - win11_desktop

  - name: Set the VM Image variables for Windows-10 Server
    set_fact:
      azure_virtual_machine_image_offer: Windows-10
      azure_virtual_machine_image_publisher: MicrosoftWindowsDesktop
      azure_virtual_machine_image_sku: WIN10-22H2-AVD
    tags:
      - win10_server

  - name: Set the VM Image variables for Windows-11 Server
    set_fact:
      azure_virtual_machine_image_offer: Windows-11
      azure_virtual_machine_image_publisher: MicrosoftWindowsDesktop
      azure_virtual_machine_image_sku: WIN11-22H2-AVD
    tags:
      - win11_server

  - name: Set the VM Image variables for Office-10
    set_fact:
      azure_virtual_machine_image_offer: Office-365
      azure_virtual_machine_image_publisher: MicrosoftWindowsDesktop
      azure_virtual_machine_image_sku: WIN10-22H2-AVD-M365
    tags:
      - office_10_vm

  - name: Set the VM Image variables for Office-11
    set_fact:
      azure_virtual_machine_image_offer: Office-365
      azure_virtual_machine_image_publisher: MicrosoftWindowsDesktop
      azure_virtual_machine_image_sku: WIN11-22H2-AVD-M365
    tags:
      - office_11_vm

  - name: Set the VM Image variables for Windows 2019-Datacenter
    set_fact:
      azure_virtual_machine_image_offer: WindowsServer
      azure_virtual_machine_image_publisher: MicrosoftWindowsServer
      azure_virtual_machine_image_sku: 2019-Datacenter
    tags:
      - win_2019_dc_vm

  - name: Set the VM Image variables for Windows 2022-Datacenter
    set_fact:
      azure_virtual_machine_image_offer: WindowsServer
      azure_virtual_machine_image_publisher: MicrosoftWindowsServer
      azure_virtual_machine_image_sku: 2022-Datacenter
    tags:
      - win_2022_dc_vm

  - name: Create an Azure VM
    azure_rm_virtualmachine:
      resource_group: "{{ azure_resource_group_name }}"
      name: "{{ azure_virtual_machine_name }}"
      vm_size: "{{ azure_virtual_machine_size }}"
      admin_username: "{{ ansible_user }}"
      admin_password: "{{ ansible_password }}"
      network_interfaces: "{{ azure_network_interface_name }}"
      managed_disk_type: "{{ azure_virtual_machine_managed_disk_type }}"
      os_disk_name: "{{ azure_virtual_machine_os_disk_name }}"
      os_type: Windows
      image:
          offer: "{{ azure_virtual_machine_image_offer }}"
          publisher: "{{ azure_virtual_machine_image_publisher }}"
          sku: "{{ azure_virtual_machine_image_sku }}"
          version: "{{ azure_virtual_machine_image_version }}" 
      started: true
      state: present
    no_log: true
    tags: always

  - name: Create virtual machine script extension to enable HTTPS WinRM listener
    azure_rm_virtualmachineextension:
      name: winrm-extension
      resource_group: "{{ azure_resource_group_name }}"
      virtual_machine_name: "{{ azure_virtual_machine_name }}"
      publisher: Microsoft.Compute
      virtual_machine_extension_type: CustomScriptExtension
      type_handler_version: '1.9'
      settings: "{{ vm_extension_settings }}"
      auto_upgrade_minor_version: true
    tags: always